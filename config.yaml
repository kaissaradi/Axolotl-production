# axolotl/config.yaml

paths:
  # For Litke mode, point this to the folder containing your 2-minute chunked .bin/.dat files
  raw_data_path: "/path/to/your/litke/chunks/folder/"
  channel_map_path: "path/to/channel_map.npy"
  output_dir: "output_results/"

recording:
  # The format flag triggers the VirtualLitkeArray in io.py
  # Set to 'litke' for folder chunks, or 'binary' (or leave blank) for standard flat files
  format: "litke"
  
  # For Litke, this should be the RAW channel count per chunk (e.g., 513 to include TTL)
  # The pipeline will automatically shrink this to the valid channel count dynamically.
  n_channels: 513
  sampling_rate: 20000
  dtype: "int16"
  
  # Optional: Provide a list of known good electrode indices. 
  # If left blank/commented out, the pipeline assumes all channels except index 0 (TTL) are valid.
  # connected_electrodes: [1, 2, 3, 5, 6, ..., 512]

pipeline:
  max_units_to_find: 200
  window_pre_samples: 20
  window_post_samples: 40
  refractory_samples: 30

preprocessing:
  segment_len: 100000

# duplicate_threshold: 0.85
# post_merge_duplicates: True

testing:
  enabled: False
  duration_sec: 60
  max_units: 15